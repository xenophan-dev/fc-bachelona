<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Base · CDMX Bach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900;1,9..144,400;1,9..144,700;1,9..144,900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/nav.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #F0E4C8; --paper-light: #FBF4DF; --ink: #1A1410; --muted: #5C4F35; --gold: #C9A877;
    --c-thu: #1E3A5F; --c-fri: #C8181C; --c-sat: #1B5E20; --c-sun: #B5613C;
    --c-act: #1A8F4F; --c-beb: #B11839; --c-com: #D67B1A;
  }
  html, body { width: 100%; }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(0,0,0,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, rgba(0,0,0,0.05) 0%, transparent 60%),
      var(--paper);
    font-family: 'Inter', sans-serif; color: var(--ink); padding-bottom: 60px; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(26,20,16,0.04) 1px, transparent 0);
    background-size: 3px 3px; pointer-events: none; mix-blend-mode: multiply; z-index: 0;
  }
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(240, 228, 200, 0.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--ink); padding: 10px 14px;
    display: flex; align-items: center; gap: 12px; font-family: 'IBM Plex Mono', monospace;
  }
  nav a.back { color: var(--ink); text-decoration: none; font-size: 16px; letter-spacing: 0.2em; }
  nav .days { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 11px; letter-spacing: 0.3em; font-weight: 700; }
  nav .days a { color: var(--muted); text-decoration: none; padding: 4px 2px; border-bottom: 2px solid transparent; }
  nav .days a.current { color: var(--ink); border-bottom-color: var(--ink); }
  /* dropdown toggle colors for this (paper) page */
  nav .more-toggle { color: var(--muted); }
  nav .more.has-current > .more-toggle { color: var(--ink); border-bottom-color: var(--ink); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px 0; position: relative; z-index: 1; }
  .hero { text-align: center; margin-bottom: 22px; }
  .hero .kicker { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.4em; text-transform: uppercase; }
  .hero h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 900; font-size: clamp(54px, 14vw, 88px); line-height: 0.9; margin: 6px 0 4px; letter-spacing: -0.025em; }
  .hero .sub { font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; color: var(--muted); }

  .panel { background: var(--paper-light); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 18px 18px 20px; margin-bottom: 22px; }
  .panel > .p-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.4em; color: var(--muted); font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); }

  /* Now / Next */
  .nn-block { padding: 4px 0 12px; }
  .nn-block + .nn-block { border-top: 1px dashed rgba(26,20,16,0.3); padding-top: 14px; }
  .nn-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.35em; color: var(--muted); font-weight: 700; }
  .nn-name { font-family: 'Fraunces', serif; font-style: italic; font-weight: 900; font-size: 30px; line-height: 1.05; margin-top: 4px; }
  .nn-now .nn-name { color: var(--c-act); }
  .nn-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: 0.04em; }
  .nn-timer { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.08em; margin-top: 12px; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); display: inline-block; padding: 7px 14px; }
  .nn-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); margin-top: 7px; letter-spacing: 0.06em; }

  /* Weather */
  .wx-now { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .wx-temp { font-family: 'Fraunces', serif; font-weight: 900; font-size: 46px; line-height: 1; }
  .wx-tempf { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); }
  .wx-desc { font-family: 'Fraunces', serif; font-style: italic; font-size: 20px; color: var(--muted); margin-left: auto; }
  .wx-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .wx-day { border: 1.5px solid var(--ink); background: var(--paper); padding: 9px 6px; text-align: center; }
  .wx-dn { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: var(--muted); }
  .wx-hl { font-family: 'Fraunces', serif; font-weight: 900; font-size: 22px; margin-top: 4px; }
  .wx-lo { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }
  .wx-c { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; line-height: 1.2; min-height: 22px; }
  .wx-err { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }

  /* Converter */
  .fx-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; }
  .fx-field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.3em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .fx-field input { width: 100%; font-family: 'Fraunces', serif; font-weight: 700; font-size: 26px; padding: 10px 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
  .fx-field input:focus { outline: none; box-shadow: 3px 3px 0 var(--ink); }
  .fx-eq { font-family: 'Fraunces', serif; font-size: 26px; color: var(--muted); padding-bottom: 10px; }
  .fx-note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-top: 12px; text-align: center; }

  .footer { margin-top: 30px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.3em; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="back">← BACH</a>
  <div class="days">
    <a href="thursday.html">THU</a>
    <a href="friday.html">FRI</a>
    <a href="saturday.html">SAT</a>
    <a href="sunday.html">SUN</a>
    <div class="more has-current">
      <button class="more-toggle" type="button" aria-haspopup="true" aria-expanded="false">MÁS ▾</button>
      <div class="more-menu">
        <a href="map.html">MAP</a>
        <a href="photos.html">PICS</a>
        <a href="labase.html" class="current">BASE</a>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="kicker">── cdmx bach '26 · el cuartel ──</div>
    <h1>La Base</h1>
    <div class="sub">— qué sigue · clima · pesos —</div>
  </div>

  <div class="panel">
    <div class="p-label">QUÉ SIGUE · WHAT'S NEXT</div>
    <div id="nownext"><div class="nn-meta">Loading the schedule…</div></div>
  </div>

  <div class="panel">
    <div class="p-label">CLIMA · CDMX WEATHER</div>
    <div id="weather"><div class="wx-err">Loading…</div></div>
  </div>

  <div class="panel">
    <div class="p-label">PESOS · MXN ⇄ USD</div>
    <div class="fx-grid">
      <div class="fx-field">
        <label for="mxn">PESOS (MXN)</label>
        <input id="mxn" type="number" inputmode="decimal" min="0" placeholder="0" />
      </div>
      <div class="fx-eq">⇄</div>
      <div class="fx-field">
        <label for="usd">DÓLARES (USD)</label>
        <input id="usd" type="number" inputmode="decimal" min="0" placeholder="0" />
      </div>
    </div>
    <div class="fx-note" id="fxNote"></div>
  </div>

  <div class="footer">─── EDWIN'S BACH · CDMX '26 ───</div>
</div>

<script src="js/venues.js"></script>
<script src="js/labase.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
